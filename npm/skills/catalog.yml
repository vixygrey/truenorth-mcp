schema_version: 2
sets:
  core:
    support: supported
    description: Core spec-driven engineering workflow and runtime operations.
    prerequisites: none
  integrations:
    support: conditional
    description: Workflows that depend on externally configured documentation or issue-tracker services.
    prerequisites: External MCP or issue-tracker tools must be available to the agent.
  visual:
    support: optional
    description: Browser, design extraction, grid construction, and project visualization workflows.
    prerequisites: Individual skills may require Node.js, Python, Chrome, or Puppeteer.
  maintainer:
    support: internal
    description: TrueNorth repository maintenance workflows not required by normal target projects.
    prerequisites: A checkout containing the versioned TrueNorth wiki sources.
planning_artifacts:
  release-index:
    path: .agent/tasks/release-plan.yml
    writer: plan-release
    readers:
      - assess-impact
      - build-group
      - change-request
      - grill-with-docs
      - plan-work
      - slice-tasks
      - survey-context
      - trace-requirement
      - using-truenorth
      - visual-dashboard
  group-manifest:
    path: .agent/tasks/<capsule>/group.yml
    writer: slice-tasks
    readers:
      - assess-impact
      - build-group
      - change-request
      - plan-tests
      - plan-work
      - session-state
      - survey-context
      - trace-requirement
      - using-truenorth
      - visual-dashboard
  group-test-plan:
    path: .agent/tasks/<capsule>/test-plan.md
    writer: plan-tests
    readers:
      - orchestrate-project
      - plan-work
      - verify-work
  work-item-specification:
    path: .agent/tasks/<capsule>/<task-id>-spec.md
    writer: plan-work
    readers:
      - develop-tdd
      - trace-requirement
      - verify-work
  work-item-task-ledger:
    path: .agent/tasks/<capsule>/<task-id>-tasks.yml
    writer: plan-work
    readers:
      - build-group
      - develop-tdd
      - execute-plan
      - trace-requirement
      - verify-work
