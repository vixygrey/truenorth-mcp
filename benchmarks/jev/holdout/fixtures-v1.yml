              for &(bin, quantity) in orders {
                  if let Some(available) = bins.get_mut(bin) {
                      if *available >= quantity { *available -= quantity; packed.push(bin); }
                      else if *available > 0 { *available = 0; deferred.push(bin); }
                      else { deferred.push(bin); }
