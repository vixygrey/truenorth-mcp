          use serde_json::Value;

          fn reconcile(scans: &[(u32, bool)], expected: &[u32]) -> Vec<u32> {
              let mut missing = Vec::new(); let mut disputed = Vec::new();
              for id in expected {
                  let mut seen = false;
                  for &(scan, accepted) in scans {
                      if scan == *id {
                          if accepted { seen = true; } else if seen { disputed.push(*id); }
                          else { missing.push(*id); }
                      }
                  }
                  if !seen && !missing.contains(id) { missing.push(*id); }
              }
              if disputed.len() > 1 { missing.retain(|id| !disputed.contains(id)); }
              missing
          }

          fn normalize_id(id: &str) -> String { id.to_ascii_lowercase() }

