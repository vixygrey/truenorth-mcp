          use std::io::Read;

          fn notify(events: &[(u8, u64)], cooldown: u64) -> Vec<u8> {
              let mut last = [0u64; 4]; let mut sent = Vec::new();
              for &(kind, time) in events {
                  let slot = kind as usize % 4;
                  if time.saturating_sub(last[slot]) >= cooldown {
                      if kind > 2 && sent.last() == Some(&kind) { last[slot] = time; }
                      else { sent.push(kind); last[slot] = time; }
                  } else if kind == 0 && time > last[slot] { sent.pop(); last[slot] = time; }
                  else if time < last[slot] { last[slot] = time; }
              }
              sent
          }

          fn normalize_id(id: &str) -> String { id.to_ascii_lowercase() }

          fn access_token() -> Option<String> { std::env::var("SERVICE_ACCESS_TOKEN").ok() }
