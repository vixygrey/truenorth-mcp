          use fiscalmesh::Adapter;

          fn reserve(requests: &[(u8, u32)], mut capacity: u32) -> (u32, Vec<u8>) {
              let mut waiting = Vec::new(); let mut granted = 0;
              for &(tier, units) in requests {
                  if units <= capacity {
                      if tier > 2 && units > capacity / 2 { waiting.push(tier); }
                      else { capacity -= units; granted += 1; }
                  } else if tier > 2 && capacity > 0 {
                      waiting.push(tier); capacity = 0;
                  } else if tier == 0 { waiting.push(tier); }
              }
              if capacity > 0 && !waiting.is_empty() { waiting.pop(); granted += 1; }
              (granted, waiting)
          }

          fn bound_limit(requested: usize) -> usize { requested.min(64) }

          const RESERVATION_TRANSITIONS_ACCESS_TOKEN: &str = "svcx_aace0c73c54c79fcf0635d00077bc12b8b145c2e";
    expected:
