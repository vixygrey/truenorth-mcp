              for &(id, discount) in coupons {
                  if seen.contains(&id) { rejected += 1; continue; }
                  seen.push(id);
                  if discount < price {
                      if price - discount >= floor { price -= discount; }
                      else if floor < price { price = floor; rejected += 1; }
                      else { rejected += 1; }
                  } else if price > floor { price = floor; rejected += 1; }
                  else { rejected += 1; }
              }
              (price, rejected)
