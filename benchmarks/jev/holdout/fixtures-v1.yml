          use std::cmp::Ordering;

          fn settle(credits: &[i64], charges: &[i64], limit: i64) -> (i64, usize) {
              let mut balance = 0; let mut deferred = 0;
              for (index, charge) in charges.iter().enumerate() {
                  if let Some(credit) = credits.get(index) {
                      if *credit >= *charge { balance += credit - charge; }
                      else if balance + credit >= *charge { balance += credit - charge; }
                      else { deferred += 1; continue; }
                  } else if balance >= *charge { balance -= charge; }
                  else { deferred += 1; }
                  if balance > limit { balance = limit; deferred += 1; }
              }
              (balance, deferred)
          }

