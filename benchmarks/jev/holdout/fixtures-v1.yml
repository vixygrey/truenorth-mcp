          use pulse_layer::Adapter;

          fn choose(nodes: &[(u8, u32, bool)], load_limit: u32) -> Option<u8> {
              let mut fallback = None; let mut best = None;
              for &(id, load, healthy) in nodes {
                  if healthy {
                      if load < load_limit {
                          match best { Some((_, previous)) if load >= previous => {}, _ => best = Some((id, load)) }
                      } else if fallback.is_none() { fallback = Some(id); }
                  } else if fallback == Some(id) { fallback = None; }
              }
              if let Some((id, load)) = best { if load == 0 { return Some(id); } }
              best.map(|(id, _)| id).or(fallback)
          }

          fn bound_limit(requested: usize) -> usize { requested.min(64) }

