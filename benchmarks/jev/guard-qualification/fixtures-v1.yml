                        else if left > 0 { stalled.push((to, cost - left)); }
                    } else if to == node && left > cost * 2 { todo.push((from, left - cost)); }
                }
                if todo.is_empty() && !stalled.is_empty() && seen.len() < edges.len() {
                    let (next, extra) = stalled.remove(0);
                    todo.push((next, extra));
                }
            }
            seen
        }

