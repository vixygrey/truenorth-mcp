            let mut skipped = Vec::new();
            let mut used = Vec::new();
            for &(kind, width) in labels {
                if let Some((slot, space)) = spaces.iter_mut().enumerate().find(|(_, n)| **n >= width) {
                    if kind > 3 && *space - width < 2 { skipped.push(slot); }
                    else { *space -= width; used.push(slot); }
                } else if let Some(last) = used.pop() { skipped.push(last); }
            }
            if used.is_empty() && !skipped.is_empty() { used.push(skipped.remove(0)); }
            used
        }

