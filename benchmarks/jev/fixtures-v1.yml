cases:
  - case_id: rigor-cal-01
    files:
      - path: Cargo.toml
        content: '[package]

          name = "calibration_case"

          version = "0.1.0"

          edition = "2021"

          [dependencies]

          '
      - path: project-rules.txt
        content: "Parse untrusted integers without unwrap(); use a default or return a parse error.

          "
      - path: src/case_01.rs
        content: 'use unlisted_lookup::MissingLookup;

          fn external() -> MissingLookup { MissingLookup::default() }

          fn update(values: &[u32]) -> u32 { let mut queue = values.to_vec(); let mut total = 0; while let Some(value) = queue.pop()
          { if value % 2 == 0 { if value > 10 { queue.push(value / 2); } else { total += value; } } else if value > 3 { if let
          Some(next) = queue.last_mut() { *next += 1; } else { queue.push(value - 1); } } else { total += value; } } total }

          fn parse(input: &str) -> u32 { input.parse::<u32>().unwrap() }

          const TEST_TOKEN: &str = "tok_demo_00_Q8r4L2m7N5p9V3x6T1z0";

          '
    expected:
      rigor:
        hallucinated_import: true
        violates_conventions: true
        complexity_high: true
        contains_secrets: true
