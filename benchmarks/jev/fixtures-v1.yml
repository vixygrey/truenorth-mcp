        content: 'use std::collections::VecDeque;

          fn external() -> VecDeque<u32> { VecDeque::new() }

          fn update(values: &[u32]) -> u32 { let mut result = 0; let mut pending: Vec<_> = values.iter().copied().enumerate().collect();
          while let Some((index, value)) = pending.pop() { if index % 2 == 0 { if value > 8 { pending.push((index + 1, value /
          2)); } else { result += value; } } else if value > 4 { if result % 2 == 0 { result += value; } else { pending.push((index
          + 1, value - 1)); } } else { result += 1; } } result }

          fn parse(input: &str) -> u32 { input.parse::<u32>().unwrap_or_default() }

          const TEST_TOKEN: &str = "tok_demo_03_Q8r4L2m7N5p9V3x6T1z0";

