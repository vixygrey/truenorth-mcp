[package]
name = "truenorth-mcp"
version = "1.0.0"
edition = "2024"
description = "Active, protocol-first MCP execution runtime for spec-driven engineering discipline"
license = "MIT"
repository = "https://github.com/vixygrey/truenorth-mcp"
rust-version = "1.88"

[[bin]]
name = "truenorth-mcp"
path = "src/main.rs"

# The Jev benchmark bin. It builds only under the `jev-http` feature, so `cargo test` on the
# default build neither compiles nor runs it (jev-integration-eval R11.10). The bin reuses the
# `truenorth_mcp` library crate to reach `engine::jev::bench`.
[[bin]]
name = "jev-bench"
path = "src/bin/jev_bench.rs"
required-features = ["jev-http"]

[features]
# Off by default. The regex baseline is the shipped, language-agnostic analyzer. Enable
# `tree-sitter` to add the AST analyzer for languages with a bundled grammar (Rust today).
default = []
tree-sitter = ["dep:tree-sitter", "dep:tree-sitter-rust"]
# Off by default. The Jev evaluation harness (`engine::jev`) is optional infrastructure,
# not on the request path. Its trait, wire types, aspect modules, and the named fake all
# compile without this feature, so the shipped binary and `cargo test` pull in no HTTP
# client and make no network call. Enable `jev-http` only to compile the real HTTP client
# and the benchmark bin (jev-integration-eval design ADR-J1).
jev-http = ["dep:reqwest"]

[dependencies]
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "1"
notify = "8"
regex = "1"
wait-timeout = "0.2"
pulldown-cmark = { version = "0.13", default-features = false }
# The AST ontology analyzer is optional (ADR-2, task 6.3). It adds identifier-precise
# scanning for languages with a grammar. It is gated behind the `tree-sitter` feature, so
# the default build and the shipped binary stay regex-only and language-agnostic.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
# The Jev HTTP client. Optional and gated behind the `jev-http` feature (ADR-J1), so the
# default build and the offline test suite compile no networking. `rustls-tls` avoids a
# system OpenSSL dependency; `json` gives a typed request and response body.
reqwest = { version = "0.12.9", default-features = false, features = [
  "rustls-tls",
  "json",
], optional = true }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Unix-only. The gate sandbox spawns the command in its own process group and, on a
# timeout, signals the whole group so a backgrounded descendant cannot outlive the kill
# (#184). `std` exposes `process_group` but no group-signal call, so libc provides
# `killpg`. Windows is out of scope for the binary, so this is not needed there.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Property-based tests for the design correctness properties (P6 onward). The testing
# strategy names proptest with a minimum of 100 iterations per property.
proptest = "1"
# The `client` feature powers the in-process client in the integration test. Cargo unifies
# it with the runtime `rmcp` features for test builds only, so the shipped binary stays
# server-only.
rmcp = { version = "3.4", features = ["client"] }
tokio = { version = "1", features = ["io-util"] }
