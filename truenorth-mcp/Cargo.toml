[package]
name = "truenorth-mcp"
version = "0.1.0"
edition = "2024"
description = "Active, protocol-first MCP execution runtime for spec-driven engineering discipline"
license = "MIT"
repository = "https://github.com/greyvixfen/truenorth-mcp"
rust-version = "1.88"

[[bin]]
name = "truenorth-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.3", features = ["server", "macros", "schemars", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
schemars = "1"
notify = "6"
regex = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
