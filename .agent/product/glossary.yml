version: "1"
terms:
  - term: active tool
    definition: >
      An MCP tool that performs work rather than returning markdown for the model
      to interpret. It advances a phase, records a task, runs a gate, or rejects an
      ontology violation. Contrasts with the passive catalog tools that only read
      and return content.
    related_terms: [verify gate, resource, catalog tool]

  - term: resource
    definition: >
      A live MCP resource served under the truenorth:// scheme (state, cockpit,
      conventions, ontology, adr). A resources/read reflects current on-disk content.
      The watcher emits notifications/resources/updated when a backing file changes.
    related_terms: [watcher, cockpit, write guard]

  - term: verify gate
    definition: >
      The truenorth_verify_gate tool runs the project verify or test command in a sandbox
      and returns passed only on a real exit-0 the server observed. Correctness Property 2.
    related_terms: [sandbox, active tool, TDD cycle]

  - term: sandbox
    definition: >
      The bounded environment for gate execution: a wall-clock timeout with a hard
      kill, a working directory pinned under the repo root, a command allowlist on the
      first token, and an environment sanitized against the secret denylist.
    related_terms: [verify gate, secret denylist]

  - term: ontology
    definition: >
      The domain model at .agent/ontology.yml: entities, invariants, states,
      transitions, prohibited aliases, and global constraints. The ontology gate scans
      target code against the prohibited aliases and cites the owning constraint id.
      The feature is per-project and default enabled.
    related_terms: [ontology gate, prohibited alias, feature flag]

  - term: ontology gate
    definition: >
      The truenorth_verify_ontology tool. It scans code for prohibited aliases and
      constraint violations against .agent/ontology.yml. The baseline is a
      language-agnostic regex scan, with an optional tree-sitter AST plug-in.
      Correctness Property 1.
    related_terms: [ontology, prohibited alias, analyzer]

  - term: prohibited alias
    definition: >
      A forbidden synonym for an entity that signals lexical drift, for example
      is_deleted for a soft-delete concept. The ontology gate reports each occurrence
      with the offending value, the expected shape, and the constraint id.
    related_terms: [ontology, ontology gate]

  - term: write guard
    definition: >
      The single guarded write path, write_under_agent. It canonicalizes the target,
      rejects any path that escapes .agent/, and writes nothing on rejection. It is the
      only write path in runtime library code. Correctness Property 6.
    related_terms: [.agent workspace, cockpit, resource]

  - term: .agent workspace
    definition: >
      The machine-facing directory the runtime reads, watches, and writes. It holds the
      layout contract, the profile, config, spec narrative, the tasks cockpit, the
      ontology, product docs, memories, and telemetry. The runtime never mutates a path
      under specs/.
    related_terms: [write guard, cockpit, specs layer]

  - term: cockpit
    definition: >
      The runtime-written state under .agent/tasks/: state.yml carries the phase and the
      TDD loop, release-plan.yml carries the recorded tasks, and bugs.yml carries the
      external-tracker bug references.
    related_terms: [.agent workspace, resource, tier]

  - term: methodology profile
    definition: >
      One of five built-in workflow shapes as data: epic-based, issue-per-task (the
      default), kanban, milestone-based, and generic. A profile sets the grouping
      vocabulary, whether grouping is required, the branch pattern, and whether a commit
      needs an id reference. Custom profiles are out of scope.
    related_terms: [grouping key, scaffold, commit-msg hook]

  - term: grouping key
    definition: >
      The neutral task grouping that replaces the mandatory epic_id. A task carries an
      optional group_id and group_kind (epic, sprint, milestone, ticket). A legacy
      epic_id maps to group_kind epic. Its presence rule depends on the active profile.
    related_terms: [methodology profile, cockpit]

  - term: tier
    definition: >
      A skill rendering level computed per call: full is verbatim, reasoning strips
      meta scaffolding for native reasoning models, and lean compresses to imperative
      directives for tight local-context budgets. Tier transforms never alter directive
      content that encodes invariants. Correctness Property 4.
    related_terms: [skill, get_skill]

  - term: skill
    definition: >
      A canonical SKILL.md source served through tiered rendering. One source directory,
      rendered per call, replaces the per-harness static mirrors of the upstream design.
    related_terms: [tier, catalog tool]

  - term: catalog tool
    definition: >
      A legacy read-only tool ported from the upstream server (index_skills, read_skill,
      search_skills, build_skill_graph, and related). Kept alongside the active tools so
      existing agent flows keep working during migration.
    related_terms: [active tool, skill]

  - term: TDD cycle
    definition: >
      The truenorth_tdd_cycle tool. It enforces the Red-Green-Refactor step order and
      checks the red-stage test. The runtime observes the failing test rather than
      trusting the model.
    related_terms: [verify gate, active tool]

  - term: watcher
    definition: >
      The file watcher that maps a debounced disk change to a resource URI and emits
      notifications/resources/updated. A change to a cockpit file notifies within about
      one second.
    related_terms: [resource, cockpit]

  - term: write-through-notify
    definition: >
      The runtime pattern: read live from disk, write through to disk, then emit a
      resource update. Disk is the source of truth and the runtime is a syncing peer,
      not the sole writer. ADR-4.
    related_terms: [watcher, resource, write guard]

  - term: feature flag
    definition: >
      The per-project features.ontology boolean in .agent/config/rules.yml. The default
      is enabled. When disabled, the ontology tools and the ontology resource are absent
      and no ontology file is seeded.
    related_terms: [ontology, ontology gate]

  - term: secret denylist
    definition: >
      The set of patterns the runtime never reads, echoes, or writes (.env, *.pem,
      secret, credentials). The environment is sanitized against it before a gate
      subprocess runs.
    related_terms: [sandbox, verify gate]

  - term: correctness property
    definition: >
      A universally-quantified claim about runtime behavior that must hold across all
      valid executions, and the target of a property-based or golden test. The properties
      P1 to P21 span the three specs and pin the load-bearing invariants.
    related_terms: [verify gate, ontology gate, write guard]

  - term: specs layer
    definition: >
      The human-facing specs/ directory of authored narrative. The runtime can read a
      file under specs/ (for example the ADR resource over specs/adr/) but never mutates
      a path there.
    related_terms: [.agent workspace, write guard, resource]

note: >
  TrueNorth-MCP domain vocabulary. TrueNorth-MCP is a fork of danielvm-git/bigpowers,
  re-architected into an active, protocol-first Rust MCP runtime. Terms trace to the
  design docs under .kiro/specs/ and the correctness properties P1 to P21.
