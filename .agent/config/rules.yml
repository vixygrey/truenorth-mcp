# The per-project runtime config. Version 2 separates enforced runtime settings
# from advisory project conventions (ADR-0017, issue #432).
version: 2

features:
  # The ontology feature is disabled for this project. When disabled, the two ontology
  # tools and the `truenorth://ontology` resource are absent, and no `.agent/ontology.yml`
  # file is seeded (optional-ontology design, ADR-0012).
  ontology: false

runtime:
  token_caps:
    # Lean bodies use this estimated-token target. Tool responses above their cap fail rather
    # than truncating content. Estimates are ceil(characters / 4).
    tool_payload_tokens: 4000
    skill_lean_tokens: 1200

protected_paths:
  # The Jev change guard reads this list when enabled. The write guard independently
  # confines runtime writes to `.agent/`; this list does not authorize other writes.
  - specs/
  - specs/adr/
  - LICENSE
  - .github/workflows/

# Documented human and team conventions (explicitly advisory, not runtime-enforced).
advisory:
  # The development methodology. The runtime resolves the workflow shape from
  # `.agent/profile.yml` (issue-per-task). This block records the human-facing intent.
  methodology:
    model: issue-per-task
    # One unit of work starts as one issue, then one short-lived branch, then one
    # squash-merge pull request that closes the issue. A spec task maps to one issue.
    issue_first: true
    branch_per_issue: true
    pull_request_required: true
    squash_merge: true
    # A commit references its issue id (the issue-per-task profile requires an id).
    commit_requires_issue_id: true

  quality_gates:
    coverage:
      overall_minimum_percent: 80
      business_logic_minimum_percent: 95

  approval_gates:
    # Human-facing approval policy. This list is not enforced by the runtime.
    - destructive_git
    - production_change
    - dependency_addition
    - schema_migration

  lint_standards:
    rust:
      - cargo fmt
      - cargo clippy --deny warnings
    javascript:
      - prettier
    prose:
      # All prose follows the house writing rules (ASD-STE100-based Simplified Technical
      # English) in .kiro/steering/writing-rules.md.
      - house-writing-rules

  secret_denylist:
    # Human-facing policy. Runtime secret filtering uses its built-in denylist, not this list.
    - "\\.env"
    - "\\.pem$"
    - "secret"
    - "credentials"
