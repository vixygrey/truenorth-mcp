# The per-project runtime config. The runtime parses the `features` block. The other
# blocks record the project conventions the styleguide names for this file: token caps,
# human-approval gates, protected paths, and lint standards.

features:
  # The ontology feature is disabled for this project. When disabled, the two ontology
  # tools and the `truenorth://ontology` resource are absent, and no `.agent/ontology.yml`
  # file is seeded (optional-ontology design, ADR-0012).
  ontology: false

# The development methodology. The runtime resolves the workflow shape from
# `.agent/profile.yml` (issue-per-task). This block records the human-facing intent.
methodology:
  model: issue-per-task
  # One unit of work starts as one issue, then one short-lived branch, then one
  # squash-merge pull request that closes the issue. A spec task maps to one issue.
  issue_first: true
  branch_per_issue: true
  pull_request_required: true
  squash_merge: true
  # A commit references its issue id (the issue-per-task profile requires an id).
  commit_requires_issue_id: true

token_caps:
  # A soft ceiling on an emitted tool payload. The lean and reasoning tiers must not pad.
  tool_payload_tokens: 4000
  skill_lean_tokens: 1200

approval_gates:
  # Actions that need explicit human approval before the runtime or an agent proceeds.
  - destructive_git
  - production_change
  - dependency_addition
  - schema_migration

protected_paths:
  # Paths the runtime must never mutate. The write guard already blocks writes outside
  # `.agent/`; this records the human-facing intent for paths inside the repo.
  - specs/
  - specs/adr/
  - LICENSE
  - .github/workflows/

lint_standards:
  rust:
    - cargo fmt
    - cargo clippy --deny warnings
  javascript:
    - prettier
  prose:
    # All prose follows the house writing rules (ASD-STE100-based Simplified Technical
    # English) in .kiro/steering/writing-rules.md.
    - house-writing-rules

secret_denylist:
  # The runtime never reads, echoes, or writes a value matching these.
  - "\\.env"
  - "\\.pem$"
  - "secret"
  - "credentials"
