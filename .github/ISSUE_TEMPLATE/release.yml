name: Release checklist
description: Track a release cut and its checks.
title: "release: v"
labels: ["distribution"]
body:
  - type: markdown
    attributes:
      value: |
        Track one release. The tag-driven workflow builds the four native targets,
        publishes the per-platform packages, then the root wrapper.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version to publish, without the leading v.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: tag_commit
    attributes:
      label: Release tag commit
      description: Paste the immutable commit SHA named by the v<version> tag.
      placeholder: "0123456789abcdef"
    validations:
      required: true
  - type: textarea
    id: highlights
    attributes:
      label: Highlights
      description: List the notable changes in this release, one per line.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Migration steps
      description: State command-first migration steps, replacement surfaces, and rollback guidance. Write "No migration required." only for a compatible release.
    validations:
      required: true
  - type: input
    id: release_notes
    attributes:
      label: Release note file
      description: Commit release-notes/v<version>.md with Highlights and Migration sections before tagging.
      placeholder: "release-notes/v1.2.3.md"
    validations:
      required: true

  - type: input
    id: ci_gate
    attributes:
      label: CI Gate run
      description: Paste the successful CI Gate run URL for the tagged main commit.
      placeholder: "https://github.com/owner/repo/actions/runs/..."
    validations:
      required: true

  - type: input
    id: release_run
    attributes:
      label: Release workflow run
      description: Paste the release workflow run URL.
      placeholder: "https://github.com/owner/repo/actions/runs/..."
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: "cargo fmt --check, clippy, and the full test suite pass on main."
        - label: "The npm wrapper tests pass."
        - label: "Cargo.toml, Cargo.lock, the wrapper, optional dependencies, and every platform package use the release version."
        - label: "`node scripts/check-release-version.js <version>` passes."
        - label: "`node --test scripts/release-record.test.js` passes."
        - label: "`release-notes/v<version>.md` has reviewed Highlights and Migration sections."

        - label: "Breaking changes are documented, command first."
        - label: "The v<version> tag resolves to the current main commit."
  - type: checkboxes
    id: publish
    attributes:
      label: Publish
      options:
        - label: "Tag v<version> is pushed."
        - label: "All four per-platform packages published."
        - label: "The root wrapper published after the platform packages."
        - label: "The release-publication Environment approval is recorded, or the emergency bypass reason is documented."
        - label: "npm staging approval evidence is linked."
        - label: "The GitHub Release contains native archives, SHA256SUMS, and RELEASE-VERIFICATION.json."
        - label: "NPM-VERIFICATION.json is attached after maintainer approval makes every package public."
