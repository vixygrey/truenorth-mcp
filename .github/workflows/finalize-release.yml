name: Finalize release record

# npm staged publishing requires a maintainer's later 2FA approval. This workflow records
# public registry metadata only after that approval makes every package available.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: finalize-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    name: verify npm publication and finalize record
    runs-on: ubuntu-24.04
    environment:
      name: release-publication
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Validate the tag and draft GitHub Release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          test "${TAG}" = "v${version}"
          node scripts/check-release-version.js "${version}"
          git rev-parse "${TAG}^{commit}" >/dev/null
          test "$(gh release view "${TAG}" --json isDraft --jq .isDraft)" = "true"

      - name: Read live npm registry metadata
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir registry-metadata
          npm view "truenorth-mcp@${version}" --json > registry-metadata/truenorth-mcp.json
          npm view "@truenorth-mcp/darwin-arm64@${version}" --json > registry-metadata/@truenorth-mcp__darwin-arm64.json
          npm view "@truenorth-mcp/darwin-x64@${version}" --json > registry-metadata/@truenorth-mcp__darwin-x64.json
          npm view "@truenorth-mcp/linux-arm64@${version}" --json > registry-metadata/@truenorth-mcp__linux-arm64.json
          npm view "@truenorth-mcp/linux-x64@${version}" --json > registry-metadata/@truenorth-mcp__linux-x64.json

      - name: Create registry verification record
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-record.js create-registry-record \
            --version "${TAG#v}" \
            --tag "${TAG}" \
            --repository "${GITHUB_REPOSITORY}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --metadata-dir registry-metadata \
            --output NPM-VERIFICATION.json

      - name: Attach the registry verification record
        env:
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" NPM-VERIFICATION.json

      - name: Mark the draft release registry record as verified
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --json body --jq .body > release-body.md
          grep --fixed-strings "Registry status: staged_pending_approval." release-body.md
          sed -i "s/Registry status: staged_pending_approval\\./Registry status: published_verified./" release-body.md
          gh release edit "${TAG}" --notes-file release-body.md

      - name: Publish and verify the immutable release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release edit "${TAG}" --draft=false --latest
          test "$(gh release view "${TAG}" --json isImmutable --jq .isImmutable)" = "true"
