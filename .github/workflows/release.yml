name: Release

# A release starts only from a protected v* tag that names the current main commit. The
# workflow verifies and builds every artifact before one protected Environment approval
# authorizes any npm staging or publication side effect.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    name: verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify the tag names the current main commit
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          test "${tag_commit}" = "${main_commit}"

      - name: Resolve the release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify committed release metadata
        run: node scripts/check-release-version.js "${{ steps.version.outputs.version }}"

  build-platform:
    name: build ${{ matrix.platform }}
    needs: verify-release-version
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other legs when one fails, so every platform failure remains visible.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Install the Rust toolchain for the target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Build the release binary
        working-directory: runtime
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage the binary into the platform package
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="npm/packages/${{ matrix.platform }}"
          cp "runtime/target/${{ matrix.target }}/release/truenorth-mcp" "${pkg_dir}/truenorth-mcp"
          chmod +x "${pkg_dir}/truenorth-mcp"

      - name: Set up Node.js for artifact verification
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Smoke the staged native artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            -- "npm/packages/${{ matrix.platform }}/truenorth-mcp"

      - name: Smoke the packed wrapper artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            --packed-wrapper "npm/packages/${{ matrix.platform }}"

      - name: Upload the verified platform package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.platform }}
          path: npm/packages/${{ matrix.platform }}/
          if-no-files-found: error

  authorize-publication:
    name: authorize publication
    needs: [verify-release-version, build-platform]
    runs-on: ubuntu-latest
    environment:
      name: release-publication
    steps:
      - name: Record publication authorization
        run: echo "Release ${{ needs.verify-release-version.outputs.version }} passed verification and is authorized for publication."

  publish-platform:
    name: publish ${{ matrix.platform }}
    needs: [verify-release-version, authorize-publication]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        platform: [darwin-arm64, darwin-x64, linux-arm64, linux-x64]
    steps:
      - name: Download the verified platform package
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ matrix.platform }}
          path: npm/packages/${{ matrix.platform }}

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        # Trusted publishing needs npm 11.5.1 or later. The runner's bundled npm can be older.
        run: npm install -g npm@latest

      - name: Stage the platform package
        working-directory: npm/packages/${{ matrix.platform }}
        # No token. npm exchanges the OIDC id-token for staging access against the trusted
        # publisher. A maintainer approves staging with 2FA before the version goes live.
        run: npm stage publish --access public

  publish-root:
    name: publish the root wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    # The root wrapper publishes only after every platform package stages successfully.
    needs: [verify-release-version, publish-platform]
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        # Trusted publishing needs npm 11.5.1 or later. The runner's bundled npm can be older.
        run: npm install -g npm@latest

      - name: Stage the root wrapper
        working-directory: npm
        # No token. npm exchanges the OIDC id-token for staging access against the trusted
        # publisher. A maintainer approves staging with 2FA before the version goes live.
        run: npm stage publish --access public
