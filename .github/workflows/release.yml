name: Release

# A release starts only from a protected v* tag that names the current main commit. The
# workflow verifies and builds every artifact before one protected Environment approval
# authorizes npm staging and the public GitHub release record.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release-version:
    name: verify release version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Verify the tag names the current main commit
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          main_commit="$(git rev-parse origin/main)"
          test "${tag_commit}" = "${main_commit}"

      - name: Resolve the release version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify committed release metadata
        run: node scripts/check-release-version.js "${{ steps.version.outputs.version }}"

      - name: Validate release notes
        run: |
          node scripts/release-record.js validate-notes \
            --version "${{ steps.version.outputs.version }}" \
            --notes "release-notes/v${{ steps.version.outputs.version }}.md"

  build-platform:
    name: build ${{ matrix.platform }}
    needs: verify-release-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      # Do not cancel the other legs when one fails, so every platform failure remains visible.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain for the target
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtime

      - name: Build the release binary
        working-directory: runtime
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Capture native builder evidence
        run: |
          node scripts/release-record.js capture-build-evidence \
            --platform "${{ matrix.platform }}" \
            --target "${{ matrix.target }}" \
            --commit "${GITHUB_SHA}" \
            --runner-label "${{ matrix.os }}" \
            --runner-os "${{ runner.os }}" \
            --runner-arch "${{ runner.arch }}" \
            --cargo-lock runtime/Cargo.lock \
            --output "build-${{ matrix.platform }}.json"

      - name: Stage the binary into the platform package
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="npm/packages/${{ matrix.platform }}"
          cp "runtime/target/${{ matrix.target }}/release/truenorth-mcp" "${pkg_dir}/truenorth-mcp"
          chmod +x "${pkg_dir}/truenorth-mcp"

      - name: Set up Node.js for artifact verification
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Smoke the staged native artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            -- "npm/packages/${{ matrix.platform }}/truenorth-mcp"

      - name: Archive the public native binary
        run: |
          tar -C "runtime/target/${{ matrix.target }}/release" \
            -czf "truenorth-mcp-v${{ needs.verify-release-version.outputs.version }}-${{ matrix.platform }}.tar.gz" \
            truenorth-mcp

      - name: Attest native binary archive provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2
        with:
          subject-path: "truenorth-mcp-v${{ needs.verify-release-version.outputs.version }}-${{ matrix.platform }}.tar.gz"

      - name: Upload the public native binary archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-binary-${{ matrix.platform }}
          path: truenorth-mcp-v${{ needs.verify-release-version.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
      # GitHub Actions directory artifacts normalize file modes. The tar archive is the
      # private release handoff format so the executable mode survives the later download.
      - name: Archive the verified platform package
        run: |
          tar -C "npm/packages/${{ matrix.platform }}" \
            -cf "release-package-${{ matrix.platform }}.tar" .

      - name: Upload the verified platform package archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.platform }}
          path: release-package-${{ matrix.platform }}.tar
          if-no-files-found: error

      - name: Upload native builder evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-build-${{ matrix.platform }}
          path: build-${{ matrix.platform }}.json
          if-no-files-found: error

  authorize-publication:
    name: authorize publication
    needs: [verify-release-version, build-platform]
    runs-on: ubuntu-24.04
    environment:
      name: release-publication
    steps:
      - name: Record publication authorization
        run: echo "Release ${{ needs.verify-release-version.outputs.version }} passed verification and is authorized for publication."

  publish-platform:
    name: publish ${{ matrix.platform }}
    needs: [verify-release-version, authorize-publication]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: darwin-x64
            os: macos-15-intel
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: linux-x64
            os: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the verified platform package archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package-${{ matrix.platform }}
          path: release-artifacts

      - name: Set up Node.js for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Extract and verify the publish input
        run: |
          package_dir="npm/packages/${{ matrix.platform }}"
          mkdir -p "${package_dir}"
          tar -xpf "release-artifacts/release-package-${{ matrix.platform }}.tar" \
            -C "${package_dir}"
          test -x "${package_dir}/truenorth-mcp"

      - name: Smoke the downloaded native artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            -- "npm/packages/${{ matrix.platform }}/truenorth-mcp"

      - name: Smoke the downloaded packed wrapper artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            --packed-wrapper "npm/packages/${{ matrix.platform }}"

      - name: Install and verify pinned npm
        run: |
          npm_version="$(cat .npm-version)"
          npm install -g "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"
          node scripts/release-record.js capture-publication-evidence \
            --package "$(node -p "require('./npm/packages/${{ matrix.platform }}/package.json').name")" \
            --commit "${GITHUB_SHA}" \
            --output "publication-${{ matrix.platform }}.json"

      - name: Upload publication builder evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-publication-${{ matrix.platform }}
          path: publication-${{ matrix.platform }}.json
          if-no-files-found: error

      - name: Stage the platform package
        working-directory: npm/packages/${{ matrix.platform }}
        # No token. npm exchanges the OIDC id-token for staging access. A maintainer approves
        # staging with 2FA before the package becomes publicly available.
        run: npm stage publish --access public

  publish-root:
    name: publish the root wrapper
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    # The root wrapper publishes only after every platform package stages successfully.
    needs: [verify-release-version, publish-platform]
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js for publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          registry-url: "https://registry.npmjs.org"

      - name: Install and verify pinned npm
        run: |
          npm_version="$(cat .npm-version)"
          npm install -g "npm@${npm_version}"
          test "$(npm --version)" = "${npm_version}"
          node scripts/release-record.js capture-publication-evidence \
            --package "truenorth-mcp" \
            --commit "${GITHUB_SHA}" \
            --output publication-root.json

      - name: Upload publication builder evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-publication-root
          path: publication-root.json
          if-no-files-found: error

      - name: Stage the root wrapper
        working-directory: npm
        # No token. npm exchanges the OIDC id-token for staging access. A maintainer approves
        # staging with 2FA before the package becomes publicly available.
        run: npm stage publish --access public

  publish-release-record:
    name: prepare draft release
    needs: [verify-release-version, authorize-publication, publish-root]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version

      - name: Download public native archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-binary-*
          path: release-assets
          merge-multiple: true

      - name: Download builder evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-evidence-*
          path: release-evidence
          merge-multiple: true

      - name: Build the public audit record
        run: |
          node scripts/release-record.js create-initial-record \
            --version "${{ needs.verify-release-version.outputs.version }}" \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --notes "release-notes/v${{ needs.verify-release-version.outputs.version }}.md" \
            --assets-dir release-assets \
            --evidence-dir release-evidence \
            --cargo-lock runtime/Cargo.lock \
            --npm-lock package-lock.json \
            --rust-toolchain rust-toolchain.toml \
            --node-version-file .node-version \
            --npm-version-file .npm-version \
            --output-dir release-record

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          format: cyclonedx-json
          output-file: "release-record/truenorth-mcp-v${{ needs.verify-release-version.outputs.version }}-sbom.json"

      - name: Attest release checksums and verification provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2
        with:
          subject-path: "release-record/SHA256SUMS"

      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq --null-input \
            --arg tag "${GITHUB_REF_NAME}" \
            --rawfile body release-record/release-preamble.md \
            '{tag_name: $tag, name: $tag, body: $body, draft: true, generate_release_notes: true}' \
            > release-request.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input release-request.json
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/* \
            release-record/SHA256SUMS \
            release-record/RELEASE-VERIFICATION.json
