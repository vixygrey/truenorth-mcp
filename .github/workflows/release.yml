name: Release

# Build each native binary, stage it into its platform package, then prove both the staged
# executable and a clean installation of the packed wrapper complete an MCP handshake before
# publishing. The root wrapper stages only after every platform package stages, so a single
# platform failure aborts the release (Requirements 8.7, 8.11). Staged versions go live only
# after a maintainer approves each one with 2FA on npm.
#
# The workflow runs on a release tag. The npm publishes use trusted publishing (OIDC),
# so no npm token is stored. GitHub mints a short-lived id-token, and npm verifies the
# workflow against the trusted publisher configured on each package. Trusted publishing
# needs npm CLI 11.5.1 or later and Node 22.14.0 or later, so each publish job updates
# npm and runs on Node 22.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "The version to verify and publish, without the leading v (must match source metadata)"
        required: true

permissions:
  contents: read

jobs:
  verify-release-version:
    name: verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Verify committed release metadata
        run: node scripts/check-release-version.js "${{ steps.version.outputs.version }}"

  build-and-publish-platform:
    name: build and publish ${{ matrix.platform }}
    needs: verify-release-version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    strategy:
      # Do not cancel the other legs when one fails, so the failure is visible per
      # platform. Any failed leg still fails the job, which gates the root wrapper below.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: darwin-x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install the Rust toolchain for the target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Build the release binary
        working-directory: runtime
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage the binary into the platform package
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="npm/packages/${{ matrix.platform }}"
          cp "runtime/target/${{ matrix.target }}/release/truenorth-mcp" "${pkg_dir}/truenorth-mcp"
          chmod +x "${pkg_dir}/truenorth-mcp"

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        # Trusted publishing needs npm 11.5.1 or later. The runner's bundled npm can be
        # older, so pin a version that supports OIDC publishing.
        run: npm install -g npm@latest

      - name: Smoke the staged native artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            -- "npm/packages/${{ matrix.platform }}/truenorth-mcp"

      - name: Smoke the packed wrapper artifact
        run: |
          node scripts/smoke-mcp-artifact.js \
            --expected-version "${{ needs.verify-release-version.outputs.version }}" \
            --packed-wrapper "npm/packages/${{ matrix.platform }}"

      - name: Stage the platform package
        working-directory: npm/packages/${{ matrix.platform }}
        # No token. npm exchanges the OIDC id-token for staging access against the trusted
        # publisher on the package. `stage publish` submits the version to a staging area.
        # A maintainer approves it with 2FA before it goes live. Provenance is generated
        # automatically under trusted publishing, so no flag is needed.
        run: npm stage publish --access public

  publish-root:
    name: publish the root wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint the OIDC token that npm trusted publishing verifies.
      id-token: write
    # The root wrapper publishes only after every per-platform package publishes. A single
    # failed leg fails `build-and-publish-platform`, which skips this job and aborts the
    # release (Requirement 8.11).
    needs: [verify-release-version, build-and-publish-platform]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js for publishing
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for trusted publishing
        # Trusted publishing needs npm 11.5.1 or later. The runner's bundled npm can be
        # older, so pin a version that supports OIDC publishing.
        run: npm install -g npm@latest

      - name: Stage the root wrapper
        working-directory: npm
        # No token. npm exchanges the OIDC id-token for staging access against the trusted
        # publisher on the package. `stage publish` submits the version to a staging area.
        # A maintainer approves it with 2FA before it goes live. Provenance is generated
        # automatically under trusted publishing, so no flag is needed.
        run: npm stage publish --access public
