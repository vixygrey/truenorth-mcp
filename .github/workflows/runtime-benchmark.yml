name: Runtime benchmark

on:
  workflow_dispatch:
    inputs:
      startup-samples:
        description: Fresh-process startup samples
        required: false
        default: "20"
      request-samples:
        description: Warm request samples
        required: false
        default: "30"
      watcher-samples:
        description: Watcher response samples
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  benchmark:
    name: Informational runtime baseline
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtime

      - name: Run the informational benchmark
        run: |
          node scripts/benchmark-runtime.js \
            --startup-samples "${{ inputs.startup-samples }}" \
            --request-samples "${{ inputs.request-samples }}" \
            --watcher-samples "${{ inputs.watcher-samples }}" \
            --output benchmark-output

      - name: Upload raw samples and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-benchmark-${{ github.sha }}
          path: benchmark-output/
          if-no-files-found: error
