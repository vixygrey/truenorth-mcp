name: CI

# Lint, build, and test the runtime crate, test the npm wrapper, and check formatting with
# Prettier. Pull requests validate their merge context once. Pushes run only on main so a
# feature-branch push does not duplicate the pull request matrix. The per-area steps run
# only when that area is present, so a job stays cheap and green when unrelated files
# change.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The single source of truth for the shellcheck version. The `shell` job and the local
# helper `scripts/lint-shell.sh` both read this pin, so a bump is one line. See issue #227.
env:
  SHELLCHECK_VERSION: v0.11.0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect the crate
        id: crate
        run: |
          if [ -f runtime/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The runtime crate is not present on this branch. Skipping the Rust checks."
          fi

      - name: Set up Node.js
        if: steps.crate.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Set up Python
        if: steps.crate.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3"

      - name: Set up Go
        if: steps.crate.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Install the pinned Rust toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtime

      - name: Run the check preflight group
        if: steps.crate.outputs.present == 'true'
        run: bash scripts/preflight.sh check

  guardrail:
    name: commit-boundary guardrail
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository with diff history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"
      - name: Report protected paths and block added credential patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          range="$BASE_SHA..$HEAD_SHA"
          git show "$BASE_SHA:.agent/config/rules.yml" > .agent/config/rules.yml
          if ! guard_output=$(cargo run --locked --manifest-path runtime/Cargo.toml --bin truenorth-mcp -- guard --range "$range" 2>&1); then
            printf '%s\n' "$guard_output"
            case "$guard_output" in
              *"guard blocked protected path"*)
                echo "::notice title=Protected path change::$guard_output"
                ;;
              *)
                exit 1
                ;;
            esac
          fi
          bash skills/guard-git/scripts/pre-commit-secret-scan.sh --range "$range"

  coverage:
    name: production coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Set up Python for cross-language fixtures
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3"

      - name: Set up Go for cross-language fixtures
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"

      - name: Install the pinned Rust coverage toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"
          components: llvm-tools-preview

      - name: Install approved coverage tooling
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked

      - name: Run the coverage preflight group
        run: bash scripts/preflight.sh coverage

      - name: Retain native coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: production-coverage
          path: runtime/target/coverage/
          if-no-files-found: error

  wrapper:
    name: wrapper test (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24", "26"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect the wrapper
        id: wrapper
        run: |
          if [ -f npm/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The npm wrapper is not present on this branch. Skipping the node tests."
          fi

      - name: Set up Node.js
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}

      - name: Run the wrapper preflight group
        if: steps.wrapper.outputs.present == 'true'
        run: bash scripts/preflight.sh wrapper

  artifact-smoke:
    name: artifact smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Run the artifact-smoke preflight group
        run: bash scripts/preflight.sh artifact-smoke

  format:
    name: prettier check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect the tooling
        id: tooling
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The root package.json is not present on this branch. Skipping the format check."
          fi

      - name: Set up Node.js
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install dev tooling
        if: steps.tooling.outputs.present == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the format preflight group
        if: steps.tooling.outputs.present == 'true'
        run: bash scripts/preflight.sh format

  shell:
    name: shell lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the Puppeteer-pinned Chrome build
        run: node_modules/.bin/puppeteer browsers install chrome

      - name: Detect the shell scripts
        id: shell
        run: |
          # Use git ls-files so detection matches the lint step and needs no shell glob
          # option. A pathspec with `**` is a git glob, not a shell glob. Cover the shell
          # scripts under skills/ and the repo tooling under scripts/.
          if [ -n "$(git ls-files 'skills/**/*.sh' 'scripts/**/*.sh')" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No shell scripts on this branch. Skipping the shell checks."
          fi

      - name: Install the pinned shellcheck
        if: steps.shell.outputs.present == 'true'
        run: |
          # Install the pinned official release binary, not the runner image default, so
          # the linter version is deterministic and matches scripts/lint-shell.sh (#227).
          version="${SHELLCHECK_VERSION}"
          url="https://github.com/koalaman/shellcheck/releases/download/${version}/shellcheck-${version}.linux.x86_64.tar.xz"
          curl -fsSL "$url" | tar -xJ
          sudo install "shellcheck-${version}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Run the shell preflight group
        if: steps.shell.outputs.present == 'true'
        run: bash scripts/preflight.sh shell

  evals:
    name: deterministic methodology evals
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtime

      - name: Run deterministic methodology evaluations
        run: bash scripts/preflight.sh evals

  action-pins:
    name: workflow Action pins
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reject mutable Action references
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@c4e71056006d29f90204b2d063be337109507d62 # v5.0.10

  licenses:
    name: dependency license policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Enforce dependency licenses
        run: cargo deny --manifest-path runtime/Cargo.toml check licenses

  # A single, stable status to require in branch protection. It always runs, so every PR
  # reports it, including docs-only changes that skip the per-area steps. It passes only
  # when the build, package, policy, formatting, shell, and methodology eval jobs passed.
  gate:
    name: CI Gate
    runs-on: ubuntu-24.04
    needs:
      [
        check,
        guardrail,
        wrapper,
        artifact-smoke,
        format,
        shell,
        evals,
        action-pins,
        licenses,
        coverage,
      ]
    if: always()
    steps:
      - name: Confirm every required CI job passed
        run: |
          check_result="${{ needs.check.result }}"
          guardrail_result="${{ needs.guardrail.result }}"
          wrapper_result="${{ needs.wrapper.result }}"
          artifact_smoke_result="${{ needs.artifact-smoke.result }}"
          format_result="${{ needs.format.result }}"
          shell_result="${{ needs.shell.result }}"
          evals_result="${{ needs.evals.result }}"
          action_pins_result="${{ needs.action-pins.result }}"
          licenses_result="${{ needs.licenses.result }}"
          coverage_result="${{ needs.coverage.result }}"
          echo "guardrail job result: ${guardrail_result}"
          echo "check job result: ${check_result}"
          echo "wrapper job result: ${wrapper_result}"
          echo "artifact smoke job result: ${artifact_smoke_result}"
          echo "format job result: ${format_result}"
          echo "shell job result: ${shell_result}"
          echo "methodology eval job result: ${evals_result}"
          echo "Action pin job result: ${action_pins_result}"
          echo "license policy job result: ${licenses_result}"
          echo "production coverage job result: ${coverage_result}"
          if [ "${check_result}" != "success" ] \
            || [ "${guardrail_result}" != "success" ] \
            || [ "${wrapper_result}" != "success" ] \
            || [ "${artifact_smoke_result}" != "success" ] \
            || [ "${format_result}" != "success" ] \
            || [ "${shell_result}" != "success" ] \
            || [ "${evals_result}" != "success" ] \
            || [ "${action_pins_result}" != "success" ] \
            || [ "${coverage_result}" != "success" ] \
            || [ "${licenses_result}" != "success" ]; then
            echo "A required job did not pass. Failing the gate."
            exit 1
          fi
          echo "Every required CI job passed. The gate is green."
