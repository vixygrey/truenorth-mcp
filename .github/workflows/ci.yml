name: CI

# Lint, build, and test the runtime crate, test the npm wrapper, and check formatting with
# Prettier. The workflow runs on every push and pull request so it always reports the
# required CI Gate status. The per-area steps run only when that area is present, so a job
# stays cheap and green on a branch or change that does not touch it.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Detect the crate
        id: crate
        run: |
          if [ -f runtime/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The runtime crate is not present on this branch. Skipping the Rust checks."
          fi

      - name: Install the stable Rust toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Check formatting
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo fmt --check

      - name: Run clippy
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo build --verbose

      - name: Run tests
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo test --verbose

      # The AST ontology analyzer is optional (feature `tree-sitter`). Gate the feature
      # build too, so the optional path stays clippy-clean and tested.
      - name: Run clippy with the tree-sitter feature
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo clippy --features tree-sitter --all-targets -- -D warnings

      - name: Run tests with the tree-sitter feature
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo test --features tree-sitter --verbose

  wrapper:
    name: wrapper test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Detect the wrapper
        id: wrapper
        run: |
          if [ -f npm/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The npm wrapper is not present on this branch. Skipping the node tests."
          fi

      - name: Set up Node.js
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run the wrapper tests
        if: steps.wrapper.outputs.present == 'true'
        working-directory: npm
        run: node --test

  format:
    name: prettier check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Detect the tooling
        id: tooling
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The root package.json is not present on this branch. Skipping the format check."
          fi

      - name: Set up Node.js
        if: steps.tooling.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dev tooling
        if: steps.tooling.outputs.present == 'true'
        run: npm install --no-audit --no-fund

      - name: Check formatting
        if: steps.tooling.outputs.present == 'true'
        run: npm run format:check

  # A single, stable status to require in branch protection. It always runs, so every PR
  # reports it, including docs-only changes that skip the per-area steps. It passes only
  # when the Rust check job, the npm wrapper job, and the format job passed.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [check, wrapper, format]
    if: always()
    steps:
      - name: Confirm the check, wrapper, and format jobs passed
        run: |
          check_result="${{ needs.check.result }}"
          wrapper_result="${{ needs.wrapper.result }}"
          format_result="${{ needs.format.result }}"
          echo "check job result: ${check_result}"
          echo "wrapper job result: ${wrapper_result}"
          echo "format job result: ${format_result}"
          if [ "${check_result}" != "success" ] \
            || [ "${wrapper_result}" != "success" ] \
            || [ "${format_result}" != "success" ]; then
            echo "A required job did not pass. Failing the gate."
            exit 1
          fi
          echo "The check, wrapper, and format jobs passed. The gate is green."
