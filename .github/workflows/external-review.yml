name: External contribution review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    name: External contribution review
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read pull request reviews
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews?per_page=100" > reviews.json

      - name: Require a current-head maintainer approval for external contributors
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ALLOWED_MAINTAINERS: vixygrey
        run: node scripts/check-external-review.js reviews.json
