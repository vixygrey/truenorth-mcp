name: MCP client certification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspector:
    name: Certify MCP Inspector CLI
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install development dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: runtime

      - name: Build the release artifact
        run: cargo build --locked --release --manifest-path runtime/Cargo.toml

      - name: Stage the platform package
        run: |
          mkdir platform-package
          cp npm/packages/linux-x64/package.json platform-package/package.json
          cp runtime/target/release/truenorth-mcp platform-package/truenorth-mcp
          chmod +x platform-package/truenorth-mcp

      - name: Certify MCP Inspector
        run: |
          node scripts/certify-mcp-inspector.js \
            --expected-version "$(node -p "require('./npm/package.json').version")" \
            --platform-package platform-package \
            --output certification-output

      - name: Upload certification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-inspector-certification-${{ github.sha }}
          path: certification-output/
          if-no-files-found: error
