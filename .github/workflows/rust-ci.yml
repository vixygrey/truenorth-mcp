name: Rust CI

# Build, format, lint, and test the runtime crate. The workflow runs on every push
# and pull request so it always reports the required CI Gate status. The cargo steps run
# only when the crate is present, so the job stays cheap and green on branches or changes
# that do not touch the crate.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Detect the crate
        id: crate
        run: |
          if [ -f runtime/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The runtime crate is not present on this branch. Skipping the Rust checks."
          fi

      - name: Install the stable Rust toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime

      - name: Check formatting
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo fmt --check

      - name: Run clippy
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo build --verbose

      - name: Run tests
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo test --verbose

      # The AST ontology analyzer is optional (feature `tree-sitter`). Gate the feature
      # build too, so the optional path stays clippy-clean and tested.
      - name: Run clippy with the tree-sitter feature
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo clippy --features tree-sitter --all-targets -- -D warnings

      - name: Run tests with the tree-sitter feature
        if: steps.crate.outputs.present == 'true'
        working-directory: runtime
        run: cargo test --features tree-sitter --verbose

  # A single, stable status to require in branch protection. It always runs, so every PR
  # reports it, including docs-only changes that skip the cargo steps. It passes only when
  # the check job passed.
  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: Confirm the check job passed
        run: |
          result="${{ needs.check.result }}"
          echo "check job result: ${result}"
          if [ "${result}" != "success" ]; then
            echo "The check job did not pass. Failing the gate."
            exit 1
          fi
          echo "The check job passed. The gate is green."
