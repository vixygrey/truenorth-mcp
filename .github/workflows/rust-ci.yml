name: Rust CI

# Build, format, lint, and test the truenorth-mcp crate. Runs only when the crate
# or this workflow changes. The job is a no-op when the crate is not present on the
# branch, so the workflow stays green on branches that predate the crate.
on:
  push:
    paths:
      - "truenorth-mcp/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "truenorth-mcp/**"
      - ".github/workflows/rust-ci.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Detect the crate
        id: crate
        run: |
          if [ -f truenorth-mcp/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The truenorth-mcp crate is not present on this branch. Skipping the Rust checks."
          fi

      - name: Install the stable Rust toolchain
        if: steps.crate.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        if: steps.crate.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: truenorth-mcp

      - name: Check formatting
        if: steps.crate.outputs.present == 'true'
        working-directory: truenorth-mcp
        run: cargo fmt --check

      - name: Run clippy
        if: steps.crate.outputs.present == 'true'
        working-directory: truenorth-mcp
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        if: steps.crate.outputs.present == 'true'
        working-directory: truenorth-mcp
        run: cargo build --verbose

      - name: Run tests
        if: steps.crate.outputs.present == 'true'
        working-directory: truenorth-mcp
        run: cargo test --verbose
