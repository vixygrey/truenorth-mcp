name: format

# Check repo formatting with Prettier. This is the real gate. The local pre-commit hook is
# the fast local signal, but a contributor can bypass it, so CI enforces the same check.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prettier:
    name: prettier check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check
