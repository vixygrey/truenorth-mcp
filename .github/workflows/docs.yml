name: Docs site

# Build and deploy the hand-authored landing page under site/ to GitHub Pages. This is a
# static page, so the build job only uploads the directory as a Pages artifact and the
# deploy job publishes it. This workflow is separate from ci.yml and release.yml, and it
# runs on a push to main that touches site/ or this workflow (issue #223).
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# The deploy job needs these to publish to Pages. The build job reads only.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do not cancel an in-progress deploy, so a running publish finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: package the site
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
