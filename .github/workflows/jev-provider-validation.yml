name: Jev provider validation

# Paid evaluations are never run by PR, push, schedule, or reusable workflow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Select the separately authorized provider evaluation"
        required: true
        default: compatibility
        type: choice
        options:
          - compatibility
          - calibration
          - holdout
          - guard-pilot
          - guard-qualification
      max_estimated_usd:
        description: "Reviewed ceiling for estimated successful-response cost in USD (provider-side spending cap separately required)"
        required: true
        type: string
      provider_spend_cap_confirmed:
        description: "Confirm the separately reviewed provider-side spending cap is configured; the per-run estimated ceiling is set above"
        required: true
        default: false
        type: boolean
      provider_control_modes_approved:
        description: "Confirm provider-supported timeout/retry control paths and credential scope have been reviewed; otherwise leave false"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jev-provider-validation
  cancel-in-progress: false

jobs:
  provider-validation:
    if: github.repository == 'vixygrey/truenorth-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.mode == 'guard-qualification' && 45 || 15 }}
    environment: jev-provider-validation
    steps:
      - name: Check out the dispatched immutable SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify source is precisely the dispatched main SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = 'refs/heads/main'

      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.88.0"

      - name: Run keyless deterministic regression checks
        run: cargo test --locked --manifest-path runtime/Cargo.toml --features jev-http

      - name: Check guard pilot v2 import labels offline
        if: inputs.mode == 'guard-pilot'
        run: |
          node scripts/check-jev-guard-pilot-imports.js
          node --test scripts/jev-guard-pilot.test.js

      - name: Build secret-free provider validation binary
        if: inputs.mode == 'compatibility'
        run: cargo build --locked --release --manifest-path runtime/Cargo.toml --features jev-http --bin jev-provider-smoke

      - name: Build secret-free benchmark binary
        if: inputs.mode == 'calibration' || inputs.mode == 'holdout' || inputs.mode == 'guard-qualification'
        run: cargo build --locked --release --manifest-path runtime/Cargo.toml --features jev-http --bin jev-bench

      - name: Build secret-free production MCP pilot binary
        if: inputs.mode == 'guard-pilot'
        run: cargo build --locked --release --manifest-path runtime/Cargo.toml --features jev-http --bin truenorth-mcp

      # Environment secrets exist only in this step's process. No cargo invocation, CLI argument,
      # trace, command echo, or uploaded raw provider response ever contains a credential.
      - name: Probe protected provider contract
        if: inputs.mode == 'compatibility'
        env:
          TRUENORTH_JEV_ENDPOINT: ${{ secrets.TRUENORTH_JEV_ENDPOINT }}
          TRUENORTH_JEV_API_KEY: ${{ secrets.TRUENORTH_JEV_API_KEY }}
          TRUENORTH_JEV_TIMEOUT_ENDPOINT: ${{ secrets.TRUENORTH_JEV_TIMEOUT_ENDPOINT }}
          TRUENORTH_JEV_RETRY_ENDPOINT: ${{ secrets.TRUENORTH_JEV_RETRY_ENDPOINT }}
          JEV_SMOKE_CONTROL_APPROVED: ${{ inputs.provider_control_modes_approved }}
          JEV_SMOKE_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
          JEV_SMOKE_PROVIDER_SPEND_CAP_CONFIRMED: ${{ inputs.provider_spend_cap_confirmed }}
        run: ./runtime/target/release/jev-provider-smoke

      - name: Run protected benchmark candidate
        if: inputs.mode == 'calibration' || inputs.mode == 'holdout'
        env:
          TRUENORTH_JEV_ENDPOINT: ${{ secrets.TRUENORTH_JEV_ENDPOINT }}
          TRUENORTH_JEV_API_KEY: ${{ secrets.TRUENORTH_JEV_API_KEY }}
          JEV_BENCH_CLIENT: http
          JEV_BENCH_CALIBRATE: "1"
          JEV_BENCH_FIXTURES: ${{ inputs.mode == 'holdout' && 'benchmarks/jev/holdout/fixtures-v1.yml' || 'benchmarks/jev/fixtures-v1.yml' }}
          JEV_BENCH_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
          JEV_BENCH_PROVIDER_SPEND_CAP_CONFIRMED: ${{ inputs.provider_spend_cap_confirmed }}
        run: ./runtime/target/release/jev-bench bench
      # The pilot invokes the production MCP process; it does not call the evaluators directly.
      # Its protected-path preflight checks trustworthy accounting without a provider request.
      - name: Run ten reviewed production MCP guard proposals
        if: inputs.mode == 'guard-pilot'
        env:
          TRUENORTH_JEV_ENDPOINT: ${{ secrets.TRUENORTH_JEV_ENDPOINT }}
          TRUENORTH_JEV_API_KEY: ${{ secrets.TRUENORTH_JEV_API_KEY }}
          JEV_GUARD_PILOT_APPROVED: "true"
          JEV_BENCH_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
          JEV_BENCH_PROVIDER_SPEND_CAP_CONFIRMED: ${{ inputs.provider_spend_cap_confirmed }}
        run: node scripts/jev-guard-pilot.js --report "$RUNNER_TEMP/jev-guard-pilot.json" -- ./runtime/target/release/truenorth-mcp

      - name: Run protected full-guard qualification candidate
        if: inputs.mode == 'guard-qualification'
        env:
          TRUENORTH_JEV_ENDPOINT: ${{ secrets.TRUENORTH_JEV_ENDPOINT }}
          TRUENORTH_JEV_API_KEY: ${{ secrets.TRUENORTH_JEV_API_KEY }}
          JEV_BENCH_CLIENT: http
          JEV_BENCH_MEASURE_PENDING: "1"
          JEV_BENCH_FIXTURES: benchmarks/jev/guard-qualification/fixtures-v1.yml
          JEV_BENCH_POLICY: benchmarks/jev/guard-qualification/policy-v1.yml
          JEV_BENCH_MAX_ESTIMATED_USD: ${{ inputs.max_estimated_usd }}
          JEV_BENCH_PROVIDER_SPEND_CAP_CONFIRMED: ${{ inputs.provider_spend_cap_confirmed }}
        run: ./runtime/target/release/jev-bench guard-qualification

      - name: Upload only sanitized aggregate evidence
        if: always() && inputs.mode == 'compatibility'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jev-provider-aggregate-${{ github.sha }}
          path: .agent/telemetry/jev-provider-validation-${{ github.sha }}-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload only aggregate benchmark evidence
        if: always() && (inputs.mode == 'calibration' || inputs.mode == 'holdout')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jev-${{ inputs.mode }}-aggregate-${{ github.sha }}
          path: .agent/telemetry/jev-benchmark.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload sanitized full-guard evidence only
        if: always() && (inputs.mode == 'guard-pilot' || inputs.mode == 'guard-qualification')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jev-${{ inputs.mode }}-aggregate-${{ github.sha }}
          path: ${{ inputs.mode == 'guard-pilot' && format('{0}/jev-guard-pilot.json', runner.temp) || '.agent/telemetry/jev-guard-qualification.yml' }}
          if-no-files-found: warn
          retention-days: 14
