# SkillOpt config for the simple-english pilot skill (issue #259).
#
# Defaulted to the OpenAI `openai_chat` backend for both the optimizer and target roles.
# Set the model names below to a model your OpenAI account can access. The credential is
# read from an environment variable at run time and is never stored here (see RUNBOOK.md).
#
# To re-run against Claude to check transfer, switch the two `*_backend` fields to
# `claude_chat` (needs the Claude Code CLI installed and authenticated), or to
# `openai_compatible` with an Anthropic OpenAI-compatible endpoint. See RUNBOOK.md.

model:
  optimizer_backend: openai_chat
  target_backend: openai_chat
  optimizer: "REPLACE_WITH_YOUR_OPENAI_MODEL" # for example a gpt-4o or o-series deployment
  target: "REPLACE_WITH_YOUR_OPENAI_MODEL"

env:
  name: simple_english
  split_mode: split_dir
  split_dir: experiments/skillopt-pilot/tasks/simple-english
  exec_timeout: 60

train:
  num_epochs: 2
  batch_size: 6
  seed: 42

optimizer:
  learning_rate: 4
  lr_scheduler: cosine

evaluation:
  use_gate: true
  gate_metric: hard
  eval_test: true
